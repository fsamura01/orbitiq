[project]
name = "orbitiq"
version = "0.1.0"
description = "AI-Powered Spacecraft Anomaly Detection & Mission Risk Intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # Dashboard
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # Data & ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    # IBM watsonx / Granite
    "ibm-watsonx-ai>=1.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
orbitiq = "app.streamlit_app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbitiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
