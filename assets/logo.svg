<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <!-- Planet glow -->
    <radialGradient id="planetGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#1a4a8a"/>
    </radialGradient>
    <!-- Orbit ring glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#58a6ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>

  <!-- Outer orbit ring (ellipse, tilted) -->
  <ellipse cx="50" cy="50" rx="40" ry="14"
    fill="none" stroke="#58a6ff" stroke-width="1.5"
    stroke-dasharray="4 2" opacity="0.5"
    transform="rotate(-30 50 50)"
    filter="url(#glow)"/>

  <!-- Inner orbit ring -->
  <ellipse cx="50" cy="50" rx="28" ry="9"
    fill="none" stroke="#79c0ff" stroke-width="1"
    stroke-dasharray="3 3" opacity="0.35"
    transform="rotate(-30 50 50)"/>

  <!-- Planet body -->
  <circle cx="50" cy="50" r="18" fill="url(#planetGrad)" filter="url(#shadow)"/>

  <!-- Planet surface detail — continent-like shapes -->
  <ellipse cx="45" cy="45" rx="6" ry="4" fill="#2a6abf" opacity="0.5" transform="rotate(-15 45 45)"/>
  <ellipse cx="56" cy="52" rx="5" ry="3" fill="#2a6abf" opacity="0.4" transform="rotate(10 56 52)"/>
  <ellipse cx="48" cy="56" rx="4" ry="2.5" fill="#2a6abf" opacity="0.35"/>

  <!-- Planet highlight -->
  <ellipse cx="44" cy="43" rx="5" ry="3.5" fill="white" opacity="0.12" transform="rotate(-20 44 43)"/>

  <!-- Satellite on the outer orbit -->
  <g transform="rotate(-30 50 50) translate(90 50) rotate(30 0 0)" filter="url(#glow)">
    <!-- Satellite body -->
    <rect x="-3" y="-2" width="6" height="4" rx="1" fill="#e6edf3"/>
    <!-- Solar panels -->
    <rect x="-9" y="-1" width="5" height="2" rx="0.5" fill="#f0a500" opacity="0.9"/>
    <rect x="4" y="-1" width="5" height="2" rx="0.5" fill="#f0a500" opacity="0.9"/>
    <!-- Antenna -->
    <line x1="0" y1="-2" x2="0" y2="-5" stroke="#e6edf3" stroke-width="0.8"/>
    <circle cx="0" cy="-5.5" r="1" fill="#58a6ff"/>
  </g>

  <!-- Signal dots emanating from satellite (anomaly detection visual) -->
  <circle cx="78" cy="28" r="1.2" fill="#3fb950" opacity="0.9"/>
  <circle cx="83" cy="23" r="0.8" fill="#3fb950" opacity="0.6"/>
  <circle cx="88" cy="18" r="0.5" fill="#3fb950" opacity="0.35"/>

  <!-- Anomaly alert dot (red) — the "detection" -->
  <circle cx="22" cy="38" r="2.5" fill="#f85149" opacity="0.9" filter="url(#glow)"/>
  <circle cx="22" cy="38" r="4.5" fill="none" stroke="#f85149" stroke-width="0.8" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="15" cy="15" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="82" cy="12" r="0.6" fill="white" opacity="0.6"/>
  <circle cx="90" cy="72" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="10" cy="70" r="0.6" fill="white" opacity="0.6"/>
  <circle cx="72" cy="88" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="25" cy="85" r="0.5" fill="white" opacity="0.4"/>
  <circle cx="88" cy="45" r="0.5" fill="white" opacity="0.5"/>
  <circle cx="8" cy="45" r="0.6" fill="white" opacity="0.4"/>

  <!-- IQ text at bottom -->
  <text x="50" y="92" text-anchor="middle"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="9" font-weight="700"
    letter-spacing="2"
    fill="#58a6ff" opacity="0.85">ORBITIQ</text>
</svg>
